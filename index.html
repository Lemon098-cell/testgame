<!DOCTYPE html> <!-- 문서가 HTML5 표준으로 작성되었음을 브라우저에 알립니다. -->
<html lang="ko"> <!-- 문서의 기본 언어를 한국어(ko)로 지정합니다. -->
<head> <!-- 문서의 메타데이터 및 외부 라이브러리, 스타일을 담는 영역입니다. -->
    <meta charset="UTF-8"> <!-- 문자 인코딩을 UTF-8로 설정하여 한글 깨짐을 방지합니다. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- 모바일 장치에서도 화면 비율이 제대로 보이도록 설정합니다. -->
    <title>3D 멀티플레이어 게임</title> <!-- 웹 브라우저 탭에 표시될 제목입니다. -->

    <!-- CSS 스타일 정의 영역 시작 -->
    <style>
        /* 페이지 전체의 기본 스타일을 설정합니다. */
        body {
            margin: 0; /* 브라우저 기본 바깥 여백을 없앱니다. */
            overflow: hidden; /* 게임 화면 바깥으로 스크롤바가 생기지 않도록 설정합니다. */
            background-color: #000; /* 배경색을 검은색으로 설정합니다. */
            font-family: Arial, sans-serif; /* 기본 글꼴을 Arial로 지정합니다. */
        }

        /* 3D 화면을 그릴 Canvas 요소의 스타일을 지정합니다. */
        #game-canvas {
            width: 100vw; /* 화면 전체 너비를 채웁니다. */
            height: 100vh; /* 화면 전체 높이를 채웁니다. */
            display: block; /* 하단 여백이 생기지 않도록 블록 요소로 변경합니다. */
        }

        /* 인증 및 캐릭터 선택 UI 레이어의 스타일을 지정합니다. */
        #auth-ui {
            position: absolute; /* 화면 전체를 덮도록 절대 위치를 잡습니다. */
            top: 0; /* 상단 끝에 밀착시킵니다. */
            left: 0; /* 좌측 끝에 밀착시킵니다. */
            width: 100%; /* 너비 100% 설정 */
            height: 100%; /* 높이 100% 설정 */
            background: rgba(0, 0, 0, 0.85); /* 반투명한 검은색 배경으로 3D 화면을 덮습니다. */
            display: flex; /* 내부 요소들을 중앙 정렬하기 위해 Flexbox를 사용합니다. */
            flex-direction: column; /* 요소들을 세로 방향으로 정렬합니다. */
            justify-content: center; /* 세로 중앙 정렬을 실행합니다. */
            align-items: center; /* 가로 중앙 정렬을 실행합니다. */
            color: white; /* 글자 색상을 흰색으로 설정합니다. */
            z-index: 10; /* 3D 캔버스보다 위에 뜨도록 레이어 순서를 높입니다. */
        }

        /* 입력 폼 컨테이너 스타일 */
        .form-container {
            display: flex; /* 세로 정렬을 위한 Flexbox 설정 */
            flex-direction: column; /* 세로 방향 정렬 */
            width: 300px; /* 입력 폼 너비 지정 */
            gap: 10px; /* 입력창 간격 설정 */
            margin-bottom: 15px; /* 하단 여백 설정 */
        }

        /* 입력창 라벨 스타일 */
        .form-container label {
            font-size: 14px; /* 글자 크기 설정 */
            color: #ccc; /* 연한 회색 글자 색상 */
            margin-bottom: -5px; /* 입력창과의 간격 줄이기 */
        }

        /* 입력창 스타일 */
        .form-container input, .form-container select {
            padding: 10px; /* 내부 여백을 줍니다. */
            font-size: 15px; /* 글자 크기를 설정합니다. */
            border: none; /* 기본 테두리를 제거합니다. */
            border-radius: 5px; /* 모서리를 둥글게 만듭니다. */
            outline: none; /* 클릭 시 생기는 기본 외곽선을 제거합니다. */
        }

        /* 버튼 그룹 스타일 */
        .button-group {
            display: flex; /* 가로 정렬을 위한 Flexbox 설정 */
            gap: 10px; /* 버튼 간격 설정 */
            width: 300px; /* 버튼 영역 너비 지정 */
        }

        /* 공통 버튼 스타일 */
        .button-group button {
            flex: 1; /* 버튼 너비를 동일하게 분배합니다. */
            padding: 10px; /* 내부 여백을 줍니다. */
            font-size: 15px; /* 글자 크기를 설정합니다. */
            border: none; /* 기본 테두리를 제거합니다. */
            border-radius: 5px; /* 모서리를 둥글게 만듭니다. */
            cursor: pointer; /* 마우스를 올렸을 때 손가락 모양으로 변경합니다. */
            color: white; /* 글자 색상을 흰색으로 설정합니다. */
        }

        /* 로그인 버튼 스타일 */
        #btn-login {
            background-color: #4CAF50; /* 초록색 배경 */
        }

        /* 회원가입 버튼 스타일 */
        #btn-signup {
            background-color: #008CBA; /* 파란색 배경 */
        }

        /* 버튼 호버 반응 */
        .button-group button:hover {
            opacity: 0.9; /* 마우스를 올리면 약간 투명하게 변경합니다. */
        }

        /* 동시 접속자 상태 표시 문구 스타일 */
        #player-count-info {
            margin-top: 15px; /* 상단 여백 추가 */
            font-size: 14px; /* 글자 크기 설정 */
            color: #ffca28; /* 노란색 계열 색상 */
        }
    </style>
    <!-- CSS 스타일 정의 영역 끝 -->
</head>
<body>

    <!-- 3D 그래픽이 그려질 캔버스 태그입니다. -->
    <canvas id="game-canvas"></canvas>

    <!-- 로그인 및 회원가입, 캐릭터 선택 UI 레이어입니다. -->
    <div id="auth-ui">
        <h2>3D 멀티플레이어 게임</h2> <!-- 안내 제목 문구입니다. -->
        <div class="form-container">
            <label for="email-input">이메일 계정</label>
            <input type="email" id="email-input" placeholder="이메일을 입력하세요" /> <!-- 이메일 입력란입니다. -->
            
            <label for="password-input">비밀번호</label>
            <input type="password" id="password-input" placeholder="비밀번호를 입력하세요" /> <!-- 비밀번호 입력란입니다. -->
            
            <label for="character-select">캐릭터 선택</label>
            <!-- 3개의 캐릭터 중 원하는 캐릭터를 고르는 드롭다운 메뉴입니다. -->
            <select id="character-select">
                <option value="grandfather.glb">할아버지 (grandfather.glb)</option>
                <option value="mouse.glb">생쥐 (mouse.glb)</option>
                <option value="zombie.glb">좀비 (zombie.glb)</option>
            </select>
        </div>
        <div class="button-group">
            <button id="btn-login">로그인</button> <!-- 로그인 실행 버튼입니다. -->
            <button id="btn-signup">회원가입</button> <!-- 회원가입 실행 버튼입니다. -->
        </div>
        <!-- 접속자 상태 메시지 표시 영역입니다. -->
        <div id="player-count-info">접속 가능 인원: 최대 15명</div>
    </div>

    <!-- ES Module 형태로 스크립트를 로드하기 위한 Import Map 설정입니다. -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
                "firebase/app": "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js",
                "firebase/analytics": "https://www.gstatic.com/firebasejs/10.7.1/firebase-analytics.js",
                "firebase/auth": "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js",
                "firebase/database": "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js"
            }
        }
    </script>

    <!-- 게임 및 인증 로직을 처리하는 JavaScript 코드 시작 -->
    <script type="module">
        // Import Map에서 매핑한 이름으로 Three.js 핵심 모듈을 불러옵니다.
        import * as THREE from 'three';
        // GLTF (.glb 파일) 3D 모델을 불러오는 로더 모듈을 불러옵니다.
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
        // Firebase 앱 초기화 및 Analytics 함수를 불러옵니다.
        import { initializeApp } from 'firebase/app';
        import { getAnalytics } from 'firebase/analytics';
        // Firebase Auth 인증 관련 함수들을 불러옵니다.
        import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword } from 'firebase/auth';
        // Firebase Realtime Database 제어 함수들을 불러옵니다.
        import { getDatabase, ref, set, get, onValue, onDisconnect } from 'firebase/database';

        // -----------------------------------------------------------------
        // [1] Firebase 설정 및 초기화
        // -----------------------------------------------------------------
        const firebaseConfig = {
            apiKey: "AIzaSyA43YtthQrg36fkVlkbKnZHv98wm61iIf8", // 발급받은 API 키
            authDomain: "testgame-650ae.firebaseapp.com", // 인증 도메인
            databaseURL: "https://testgame-650ae-default-rtdb.firebaseio.com", // 실시간 데이터베이스 URL
            projectId: "testgame-650ae", // 프로젝트 ID
            storageBucket: "testgame-650ae.firebasestorage.app", // 스토리지 버킷
            messagingSenderId: "1082222034915", // 메시징 발신자 ID
            appId: "1:1082222034915:web:8d847237286c8951cfaad6", // 앱 ID
            measurementId: "G-CBQ220MB32" // 애널리틱스 ID
        };

        // 파이어베이스 앱을 전달받은 설정으로 초기화합니다.
        const app = initializeApp(firebaseConfig);
        // 애널리틱스 객체를 생성합니다.
        const analytics = getAnalytics(app);
        // 파이어베이스 인증 객체를 생성합니다.
        const auth = getAuth(app);
        // 실시간 데이터베이스 객체를 가져옵니다.
        const db = getDatabase(app);

        // -----------------------------------------------------------------
        // [2] 게임 전역 변수 및 물리 파라미터 선언
        // -----------------------------------------------------------------
        let scene, camera, renderer; // Three.js 필수 요소
        let myPlayerId = null; // 로그인한 내 플레이어의 고유 UID
        let localPlayerMesh = null; // 내 플레이어의 3D 메쉬
        let selectedModelFile = 'grandfather.glb'; // 선택된 캐릭터 모델 파일명
        const MAX_PLAYERS = 15; // 최대 인원 제한 수 (15명)
        const otherPlayers = {}; // 다른 플레이어들의 3D 메쉬 보관 객체
        const keyboardKeys = {}; // 키보드 입력 상태 저장 객체
        const moveSpeed = 0.15; // 이동 속도

        // 점프 및 중력 물리 관련 변수 설정
        let velocityY = 0; // 세로 방향(Y축) 속도
        const gravity = -0.012; // 적용될 중력 가속도
        const jumpPower = 0.28; // 점프 시 올라가는 첫 속도
        let isGrounded = true; // 현재 땅이나 다른 플레이어 위에 서있는지 여부
        const PLAYER_SIZE = { x: 1.0, y: 1.8, z: 1.0 }; // 캐릭터 충돌 크기 (가로, 세로, 두께)

        // -----------------------------------------------------------------
        // [3] Three.js 3D 환경 기본 설정
        // -----------------------------------------------------------------
        function initThreeJS() {
            // 새로운 3D 장면을 생성합니다.
            scene = new THREE.Scene();
            // 배경색을 하늘색으로 설정합니다.
            scene.background = new THREE.Color(0x87ceeb);

            // 원근 카메라 설정 (시야각 75도)
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 5, 10);

            // WebGL 렌더러 생성 및 설정
            renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('game-canvas'), antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);

            // 조명 추가 (전체 조명 및 직사광선)
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambientLight);

            const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
            directionalLight.position.set(10, 20, 10);
            scene.add(directionalLight);

            // 바닥 격자판 추가
            const gridHelper = new THREE.GridHelper(50, 50);
            scene.add(gridHelper);

            // 화면 크기 변경 반응 이벤트
            window.addEventListener('resize', onWindowResize);
        }

        // 창 크기 변경 처리 함수
        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // -----------------------------------------------------------------
        // [4] 캐릭터 GLB 모델 로드 함수
        // -----------------------------------------------------------------
        function createPlayerMesh(modelName, isLocal = false) {
            // 그룹 객체를 생성하여 모델을 담습니다.
            const playerGroup = new THREE.Group();

            // GLTF 로더 객체 생성
            const loader = new GLTFLoader();
            // 요청받은 경로 구조인 캐릭터 폴더 안에서 선택된 GLB 모델을 로드합니다.
            const modelPath = `./캐릭터/${modelName}`;

            loader.load(
                modelPath,
                (gltf) => { // 로드 성공 시
                    const model = gltf.scene;
                    playerGroup.add(model); // 그룹에 모델 추가
                },
                undefined,
                (error) => { // 로드 실패 시 대체용 상자 모델 생성
                    console.warn(`${modelPath} 로드 실패. 대체 상자 모델을 생성합니다.`, error);
                    const geometry = new THREE.BoxGeometry(PLAYER_SIZE.x, PLAYER_SIZE.y, PLAYER_SIZE.z);
                    const material = new THREE.MeshStandardMaterial({ color: isLocal ? 0x00ff00 : 0xff0000 });
                    const cubeMesh = new THREE.Mesh(geometry, material);
                    cubeMesh.position.y = PLAYER_SIZE.y / 2;
                    playerGroup.add(cubeMesh);
                }
            );

            // 만들어진 그룹을 3D 장면에 추가 후 반환합니다.
            scene.add(playerGroup);
            return playerGroup;
        }

        // -----------------------------------------------------------------
        // [5] 회원가입 및 로그인 인증 로직
        // -----------------------------------------------------------------
        // 회원가입 버튼 클릭 이벤트
        document.getElementById('btn-signup').addEventListener('click', () => {
            const email = document.getElementById('email-input').value.trim();
            const password = document.getElementById('password-input').value.trim();

            if (!email || !password) {
                alert('이메일과 비밀번호를 모두 입력해 주세요.');
                return;
            }

            // Firebase Auth를 이용한 회원가입 처리
            createUserWithEmailAndPassword(auth, email, password)
                .then((userCredential) => {
                    alert('회원가입이 완료되었습니다! 로그인해 주세요.');
                })
                .catch((error) => {
                    alert('회원가입 실패: ' + error.message);
                });
        });

        // 로그인 버튼 클릭 이벤트
        document.getElementById('btn-login').addEventListener('click', async () => {
            const email = document.getElementById('email-input').value.trim();
            const password = document.getElementById('password-input').value.trim();
            selectedModelFile = document.getElementById('character-select').value; // 드롭다운에서 선택한 캐릭터 GLB 파일명

            if (!email || !password) {
                alert('이메일과 비밀번호를 모두 입력해 주세요.');
                return;
            }

            try {
                // 15명 접속 인원 제한 확인 로직
                const playersRef = ref(db, 'players');
                const snapshot = await get(playersRef);
                const currentPlayersData = snapshot.val() || {};
                const currentCount = Object.keys(currentPlayersData).length;

                // 이미 15명이 차 있고 본인이 접속 상태가 아니라면 제한
                if (currentCount >= MAX_PLAYERS) {
                    alert(`서버 접속 인원이 초과되었습니다. (현재: ${currentCount}/${MAX_PLAYERS}명)\n잠시 후 다시 시도해 주세요.`);
                    return;
                }

                // Firebase Auth를 이용한 로그인 처리
                const userCredential = await signInWithEmailAndPassword(auth, email, password);
                myPlayerId = userCredential.user.uid; // 내 UID 설정
                startGame(); // 게임 실행

            } catch (error) {
                alert('로그인 실패: ' + error.message);
            }
        });

        // -----------------------------------------------------------------
        // [6] 게임 접속 및 네트워크 연동
        // -----------------------------------------------------------------
        function startGame() {
            // 로그인 UI를 화면에서 숨깁니다.
            document.getElementById('auth-ui').style.display = 'none';

            // 선택한 3D 캐릭터 모델을 이용하여 내 플레이어를 생성합니다.
            localPlayerMesh = createPlayerMesh(selectedModelFile, true);

            // 키보드 입력 감지 이벤트 등록
            window.addEventListener('keydown', (e) => keyboardKeys[e.code] = true);
            window.addEventListener('keyup', (e) => keyboardKeys[e.code] = false);

            // 내 플레이어 데이터베이스 참조 주소 설정
            const myPlayerRef = ref(db, 'players/' + myPlayerId);

            // 접속 종료 시 데이터베이스에서 내 데이터 자동 제거 설정
            onDisconnect(myPlayerRef).remove();

            // 데이터베이스에 접속 위치 정보 및 선택한 캐릭터 파일명 기록
            set(myPlayerRef, {
                model: selectedModelFile, // 선택된 GLB 파일명
                x: 0,
                y: 0,
                z: 0,
                rotationY: 0
            });

            // 접속 중인 모든 플레이어 데이터 수신 감시
            const allPlayersRef = ref(db, 'players');
            onValue(allPlayersRef, (snapshot) => {
                const playersData = snapshot.val() || {};
                updateOtherPlayers(playersData);
            });

            // 프레임 렌더링 루프 실행
            animate();
        }

        // 다른 접속자들의 캐릭터 생성 및 위치 수신 함수
        function updateOtherPlayers(playersData) {
            for (let id in playersData) {
                if (id === myPlayerId) continue; // 나 자신은 처리에서 제외합니다.

                const pData = playersData[id];

                // 새로운 접속자가 감지되면 해당 접속자가 고른 GLB 캐릭터 모델로 3D 메쉬 생성
                if (!otherPlayers[id]) {
                    otherPlayers[id] = createPlayerMesh(pData.model || 'grandfather.glb', false);
                }

                // 위치 및 회전각 실시간 동기화
                otherPlayers[id].position.set(pData.x, pData.y, pData.z);
                otherPlayers[id].rotation.y = pData.rotationY;
            }

            // 접속을 끊은 다른 플레이어의 메쉬를 화면에서 삭제
            for (let id in otherPlayers) {
                if (!playersData[id]) {
                    scene.remove(otherPlayers[id]);
                    delete otherPlayers[id];
                }
            }
        }

        // -----------------------------------------------------------------
        // [7] AABB(Box3) 기반 바운딩 박스 생성 함수 (충돌 검사용)
        // -----------------------------------------------------------------
        function getPlayerBoundingBox(position) {
            // 위치 좌표를 기준으로 캐릭터 크기만큼 상자 영역을 계산합니다.
            const minX = position.x - PLAYER_SIZE.x / 2;
            const maxX = position.x + PLAYER_SIZE.x / 2;
            const minY = position.y;
            const maxY = position.y + PLAYER_SIZE.y;
            const minZ = position.z - PLAYER_SIZE.z / 2;
            const maxZ = position.z + PLAYER_SIZE.z / 2;

            return new THREE.Box3(
                new THREE.Vector3(minX, minY, minZ),
                new THREE.Vector3(maxX, maxY, maxZ)
            );
        }

        // -----------------------------------------------------------------
        // [8] 내 플레이어 이동, 점프 및 물리 충돌 처리
        // -----------------------------------------------------------------
        function handleLocalPlayerMovement() {
            if (!localPlayerMesh) return;

            let moved = false;

            // 기존 시도 위치를 백업합니다.
            const nextPosition = localPlayerMesh.position.clone();

            // WASD 및 방향키 입력에 따른 평면 이동 거리 계산
            let moveX = 0;
            let moveZ = 0;

            if (keyboardKeys['KeyW'] || keyboardKeys['ArrowUp']) {
                moveZ -= moveSpeed;
                localPlayerMesh.rotation.y = Math.PI;
                moved = true;
            }
            if (keyboardKeys['KeyS'] || keyboardKeys['ArrowDown']) {
                moveZ += moveSpeed;
                localPlayerMesh.rotation.y = 0;
                moved = true;
            }
            if (keyboardKeys['KeyA'] || keyboardKeys['ArrowLeft']) {
                moveX -= moveSpeed;
                localPlayerMesh.rotation.y = -Math.PI / 2;
                moved = true;
            }
            if (keyboardKeys['KeyD'] || keyboardKeys['ArrowRight']) {
                moveX += moveSpeed;
                localPlayerMesh.rotation.y = Math.PI / 2;
                moved = true;
            }

            // 1. 스페이스바 누르면 점프 처리 (바닥이나 플레이어 위에 있을 때만 가동)
            if (keyboardKeys['Space'] && isGrounded) {
                velocityY = jumpPower; // 위 방향으로 초기 점프 속도를 할당
                isGrounded = false; // 땅에서 떨어짐
                moved = true;
            }

            // 2. 중력 가속도 적용 (공중에 있을 때 아래로 가속)
            velocityY += gravity;
            nextPosition.y += velocityY; // Y축(높이) 수직 위치 업데이트

            // 3. X축 수평 이동 충돌 체크
            nextPosition.x += moveX;
            let testBoxX = getPlayerBoundingBox(nextPosition);
            for (let id in otherPlayers) {
                let otherBox = getPlayerBoundingBox(otherPlayers[id].position);
                if (testBoxX.intersectsBox(otherBox)) { // 다른 플레이어와 겹칠 경우
                    nextPosition.x -= moveX; // X축 이동을 취소하여 밀려남 막음 (벽 부딪힘 효과)
                    break;
                }
            }

            // 4. Z축 수평 이동 충돌 체크
            nextPosition.z += moveZ;
            let testBoxZ = getPlayerBoundingBox(nextPosition);
            for (let id in otherPlayers) {
                let otherBox = getPlayerBoundingBox(otherPlayers[id].position);
                if (testBoxZ.intersectsBox(otherBox)) { // 다른 플레이어와 겹칠 경우
                    nextPosition.z -= moveZ; // Z축 이동을 취소하여 밀려남 막음
                    break;
                }
            }

            // 5. Y축 수직(바닥 및 플레이어 머리 탑 쌓기) 착지 충돌 체크
            isGrounded = false;

            // 바닥(Y=0) 착지 확인
            if (nextPosition.y <= 0) {
                nextPosition.y = 0; // 바닥 높이 고정
                velocityY = 0; // 떨어지던 속도 초기화
                isGrounded = true; // 착지 상태 완료
            } else {
                // 다른 플레이어 머리 위로 착지하는 탑 쌓기 검사
                let testBoxY = getPlayerBoundingBox(nextPosition);
                for (let id in otherPlayers) {
                    let otherPos = otherPlayers[id].position;
                    let otherBox = getPlayerBoundingBox(otherPos);

                    // 공중에서 아래로 떨어질 때 다른 플레이어 머리 영역에 닿았는지 확인
                    if (testBoxY.intersectsBox(otherBox)) {
                        // 내가 상대방의 머리 위치(높이) 위쪽에 있었던 경우 착지 허용
                        if (localPlayerMesh.position.y >= otherPos.y + PLAYER_SIZE.y - 0.2 && velocityY <= 0) {
                            nextPosition.y = otherPos.y + PLAYER_SIZE.y; // 상대방 머리 위에 내 위치 고정
                            velocityY = 0;
                            isGrounded = true; // 탑 쌓기 착지 완료
                            break;
                        }
                    }
                }
            }

            // 이동한 최종 좌표를 내 메쉬 위치로 반영
            localPlayerMesh.position.copy(nextPosition);

            // 카메라가 내 캐릭터를 추적하도록 위치 설정
            camera.position.x = localPlayerMesh.position.x;
            camera.position.z = localPlayerMesh.position.z + 10;
            camera.position.y = localPlayerMesh.position.y + 5;
            camera.lookAt(localPlayerMesh.position);

            // 이동하거나 점프하여 위치가 변했을 때 파이어베이스 DB에 실시간 위치 전달
            if ((moved || !isGrounded || velocityY !== 0) && myPlayerId) {
                set(ref(db, 'players/' + myPlayerId), {
                    model: selectedModelFile,
                    x: localPlayerMesh.position.x,
                    y: localPlayerMesh.position.y,
                    z: localPlayerMesh.position.z,
                    rotationY: localPlayerMesh.rotation.y
                });
            }
        }

        // -----------------------------------------------------------------
        // [9] 메인 프레임 렌더링 루프
        // -----------------------------------------------------------------
        function animate() {
            requestAnimationFrame(animate);
            handleLocalPlayerMovement(); // 위치 계산 및 물리 충돌 적용
            renderer.render(scene, camera); // 3D 출력
        }

        // 초기 화면 구성을 실행합니다.
        initThreeJS();
    </script>
    <!-- 게임 로직 끝 -->
</body>
